<!DOCTYPE HTML>

<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="favicon.png" type="image/png">

    <!-- Primary Meta Tags -->
    <title>MyPayIndia Legacy</title>
    <meta name="title" content="MyPayIndia Legacy">
    <meta property="og:title" content="MyPayIndia Legacy">
    <meta property="twitter:title" content="MyPayIndia Legacy">
    <meta name="description" content="The official MyPayIndia app for legacy devices running iOS 7+">

    <!-- Open Graph / Facebook -->

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">

</head>

<style>
    * {
        font-family: system-ui, -apple-system, BlinkMacSystemFont,
            "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell,
            "Open Sans", "Helvetica Neue", sans-serif;

        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        font-size: 1rem;
    }

    body {
        margin: 0;
        padding: 1rem;

        text-align: center;

        display: -webkit-box;
        display: -webkit-flex;
        display: flex;

        -webkit-box-orient: vertical;
        -webkit-box-direction: normal;
        -webkit-flex-direction: column;
        flex-direction: column;

        -webkit-box-align: center;
        -webkit-align-items: center;
        align-items: center;
    }

    .logo {
        width: 5rem;
        height: auto;
    }

    .title {
        font-size: 3rem;
        margin: 0.5rem 0 1rem 0;
        font-weight: 100;
    }

    .bold {
        font-size: 3rem;
        font-weight: 600;
    }

    .tagline {
        margin: 0.5rem;
        line-height: 1.4;
    }

    .warning {
        margin: 0.5rem;
        color: #cc0000;
        line-height: 1.4;
    }

    .gallery {
        width: 100%;
        max-width: 40rem;

        padding: 1rem 0;

        display: -webkit-box;
        display: -webkit-flex;
        display: flex;

        -webkit-flex-wrap: wrap;
        flex-wrap: wrap;

        -webkit-justify-content: center;
        justify-content: center;

        margin: -0.5rem;
    }

    .gallery-item {
        width: 5rem;

        margin: 0.5rem;

        border-radius: .5rem;
        background-color: #d9d9d9;

        -webkit-transition: background-color 0.2s ease;
        transition: background-color 0.2s ease;
    }

    .gallery-item:hover {
        display: block;
        background-color: #9e9e9e;
    }

    .links {
        margin: .5rem 0;
        text-align: center;
    }

    .link {
        display: inline-block;
        margin: 0 0.5rem;
        text-decoration: none;
        color: #0088cc;
    }

    .download-link:hover {
        color: #003e5e;
    }

    .credits {
        color: #6e6e6e;
        font-size: .6rem;
    }

    .credits>a {
        color: #0088cc;
        font-size: .6rem;
        text-decoration: none;
    }

    @media screen and (max-width: 700px) {
        br {
            display: none;
        }
    }
</style>

<body role="main">
    <img class="logo" src="mylegend.png" alt="Logo">

    <p class="title">MyPayIndia <span class="bold">Legacy</span></p>
    <p class="tagline">The future of online banking, now available on <br>unsupported iOS devices. (iOS 7+)</p>

    <div class="links">
        <a class="link" href="real.ipa">Download IPA</a>
        <a class="link" href="https://cydia.mypayindia.com/repo">Add Repo</a>
    </div>

    <div class="gallery">
        <img class="gallery-item" src="IMG_1.PNG">
        <img class="gallery-item" src="IMG_2.PNG">
        <img class="gallery-item" src="IMG_3.PNG">
        <img class="gallery-item" src="IMG_4.PNG">
        <img class="gallery-item" src="IMG_5.PNG">
    </div>

    <p class="warning">This app is currently in Public Beta, and as such, expect it to be buggy and <br>some features to
        not yet be
        completed.</p>

    <p class="credits">Logo: <a href="https://toastito.co.uk/">@toastito</a> | App: <a
            href="https://twitter.com/timi2506">@timi2506</a> | Website: <a href="https://ibmpc.gr/">@ibm_pc</a></p>
</body>

</html>
