name: Build IPA

on:
  push:
    paths:
      - 'input/*.app.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Find app zip
        id: find
        run: |
          ZIP=$(ls input/*.app.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "No .app.zip found in input/"
            exit 1
          fi
          echo "zip=$ZIP" >> $GITHUB_OUTPUT

      - name: Extract app
        run: |
          mkdir -p /tmp/appextract
          unzip -q "${{ steps.find.outputs.zip }}" -d /tmp/appextract
          APP=$(find /tmp/appextract -maxdepth 2 -name "*.app" -type d | head -1)
          APP_NAME=$(basename "$APP" .app)
          echo "APP_PATH=$APP" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV

      - name: Build and Move IPA
        run: |
          BUILD_DIR="/tmp/ipa_build"
          mkdir -p "$BUILD_DIR/Payload"
          
          cp -R "$APP_PATH" "$BUILD_DIR/Payload/"
          
          find "$BUILD_DIR/Payload" -type d -exec chmod 0755 {} \;
          find "$BUILD_DIR/Payload" -type f -exec chmod 0644 {} \;
          
          if [ -f "$BUILD_DIR/Payload/$APP_NAME.app/$APP_NAME" ]; then
            chmod 0755 "$BUILD_DIR/Payload/$APP_NAME.app/$APP_NAME"
          fi

          cd "$BUILD_DIR"
          zip -qr latest.ipa Payload/
          
          cd ${{ github.workspace }}
          mkdir -p assets
          mv -f "$BUILD_DIR/latest.ipa" assets/latest.ipa

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/latest.ipa
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Build latest.ipa"
          git push
