name: Build Deb and IPA

on:
  push:
    paths:
      - 'input/*/*.app.zip'
      - 'input/*/*.zip'
      - 'input/*/*.ipa'
      - 'input/*/*.app/**'
      - 'input/*/.configUpdateOnly'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Process Apps
        run: |
          mkdir -p repo/debs
          mkdir -p assets
          
          # Function to read plist value using python3
          read_plist() {
            python3 -c "import plistlib, sys
          try:
              with open(sys.argv[1], 'rb') as f:
                  p = plistlib.load(f)
                  if isinstance(p, dict) and sys.argv[2] in p:
                      print(p[sys.argv[2]])
          except Exception:
              pass" "$1" "$2"
          }

          # Function to read config with fallback to Template.plist
          read_config() {
            local KEY=$1
            local PLIST=$2
            local TEMPLATE="configs/Template.plist"
            local NO_TEMPLATE=$3
            
            # Using absolute paths
            local VAL=$(read_plist "$(pwd)/$PLIST" "$KEY")
            if [ -z "$VAL" ] && [ "$NO_TEMPLATE" != "true" ] && [ -f "$TEMPLATE" ]; then
              VAL=$(read_plist "$(pwd)/$TEMPLATE" "$KEY")
            fi
            echo "$VAL"
          }

          # Loop over all directories in input/
          for APP_DIR_PATH in input/*/; do
            # Remove trailing slash
            APP_DIR_PATH=${APP_DIR_PATH%/}
            NAME=$(basename "$APP_DIR_PATH")
            
            # Skip if not a directory
            if [ ! -d "$APP_DIR_PATH" ]; then
              continue
            fi
            
            # Skip if there are no .zip, .ipa, or .app files in the directory
            HAS_VALID_APP=$(find "$APP_DIR_PATH" -maxdepth 1 \( -name "*.zip" -o -name "*.ipa" -o -name "*.app" \) | head -1)
            IS_CONFIG_UPDATE="false"
            if [ -f "$APP_DIR_PATH/.configUpdateOnly" ]; then
              IS_CONFIG_UPDATE="true"
            fi
            
            if [ -z "$HAS_VALID_APP" ] && [ "$IS_CONFIG_UPDATE" = "false" ]; then
              continue
            fi
            
            echo "======================================"
            echo "Processing $NAME..."
            
            CONFIG="configs/$NAME.plist"
            if [ ! -f "$CONFIG" ]; then
              echo "::warning title=Missing Config::No config file found for $NAME at $CONFIG"
              continue
            fi
            
            # Read configs
            DEB_NAME=$(read_config "Name" "$CONFIG")
            DEB_DESC=$(read_config "Description" "$CONFIG")
            DEB_MAINTAINER=$(read_config "Maintainer" "$CONFIG")
            DEB_AUTHOR=$(read_config "Author" "$CONFIG")
            DEB_SECTION=$(read_config "Section" "$CONFIG")
            ICON_URL=$(read_config "Icon URL" "$CONFIG" "true") # No template fallback
            DETAIL_PAGE=$(read_config "DetailPage" "$CONFIG" "true") # Optional config, no template fallback
            
            DEB_NAME=${DEB_NAME:-$NAME}
            DEB_DESC=${DEB_DESC:-$NAME application}
            DEB_MAINTAINER=${DEB_MAINTAINER:-Unknown}
            DEB_AUTHOR=${DEB_AUTHOR:-Unknown}
            DEB_SECTION=${DEB_SECTION:-Applications}

            if [ "$IS_CONFIG_UPDATE" = "true" ]; then
              # Find existing deb by matching Name
              OLD_DEB=""
              for deb in repo/debs/*.deb; do
                if [ -f "$deb" ]; then
                  DEB_PKG_NAME=$(dpkg-deb -f "$deb" Name)
                  if [ "$DEB_PKG_NAME" = "$DEB_NAME" ]; then
                    OLD_DEB="$deb"
                    break
                  fi
                fi
              done
              
              if [ -z "$OLD_DEB" ]; then
                echo "::warning title=Missing Deb::Could not find existing .deb matching Name '$DEB_NAME' for config update of $NAME."
                continue
              fi
              
              # Extract deb
              BUILD_DIR="/tmp/deb_build_$NAME"
              rm -rf "$BUILD_DIR"
              mkdir -p "$BUILD_DIR"
              dpkg-deb -R "$OLD_DEB" "$BUILD_DIR"
              
              # Read old properties that we must keep
              OLD_PKG=$(grep "^Package: " "$BUILD_DIR/DEBIAN/control" | cut -d' ' -f2)
              OLD_VER=$(grep "^Version: " "$BUILD_DIR/DEBIAN/control" | cut -d' ' -f2)
              OLD_ARCH=$(grep "^Architecture: " "$BUILD_DIR/DEBIAN/control" | cut -d' ' -f2)
              
              # Rewrite control
              echo "Package: $OLD_PKG" > "$BUILD_DIR/DEBIAN/control"
              echo "Name: $DEB_NAME" >> "$BUILD_DIR/DEBIAN/control"
              echo "Version: $OLD_VER" >> "$BUILD_DIR/DEBIAN/control"
              echo "Architecture: $OLD_ARCH" >> "$BUILD_DIR/DEBIAN/control"
              echo "Description: $DEB_DESC" >> "$BUILD_DIR/DEBIAN/control"
              echo "Maintainer: $DEB_MAINTAINER" >> "$BUILD_DIR/DEBIAN/control"
              echo "Author: $DEB_AUTHOR" >> "$BUILD_DIR/DEBIAN/control"
              echo "Section: $DEB_SECTION" >> "$BUILD_DIR/DEBIAN/control"
              if [ -n "$ICON_URL" ]; then
                echo "Icon: $ICON_URL" >> "$BUILD_DIR/DEBIAN/control"
              fi
              if [ -n "$DETAIL_PAGE" ]; then
                echo "Depiction: $DETAIL_PAGE" >> "$BUILD_DIR/DEBIAN/control"
              fi
              
              dpkg-deb -Zgzip --root-owner-group -b "$BUILD_DIR" "$OLD_DEB"
              echo "Updated config for Deb: $(basename "$OLD_DEB")"
              
              # Clear input folder contents
              find "$APP_DIR_PATH" -mindepth 1 -maxdepth 1 ! -name ".gitkeep" -exec rm -rf {} +
              
              echo "Finished config update for $NAME."
              continue
            fi
            
            # Normal processing: Create extraction directory
            APP_EXTRACT_DIR="/tmp/appextract_$NAME"
            rm -rf "$APP_EXTRACT_DIR"
            mkdir -p "$APP_EXTRACT_DIR"
            
            # Find the app source (app folder or zip/ipa archive)
            APP_SRC=$(find "$APP_DIR_PATH" -maxdepth 1 -name "*.app" -type d | head -1)
            if [ -n "$APP_SRC" ]; then
              cp -R "$APP_SRC" "$APP_EXTRACT_DIR/"
            else
              ARCHIVE=$(find "$APP_DIR_PATH" -maxdepth 1 -type f \( -name "*.zip" -o -name "*.ipa" \) | head -1)
              if [ -n "$ARCHIVE" ]; then
                unzip -q "$ARCHIVE" -d "$APP_EXTRACT_DIR/"
              else
                echo "::warning title=Missing Input Files::No valid input files found in $APP_DIR_PATH"
                continue
              fi
            fi
            
            # Now find the actual .app inside APP_EXTRACT_DIR
            APP_PATH=$(find "$APP_EXTRACT_DIR" -name "*.app" -type d | head -1)
            if [ -z "$APP_PATH" ]; then
              echo "::warning title=Missing App::No .app found after extracting $NAME"
              continue
            fi
            APP_BUNDLE_NAME=$(basename "$APP_PATH" .app)
            
            # Read Info.plist
            INFO="$APP_PATH/Info.plist"
            BUNDLE_ID=$(read_plist "$INFO" CFBundleIdentifier)
            VERSION=$(read_plist "$INFO" CFBundleShortVersionString)
            BUNDLE_ID=${BUNDLE_ID:-com.unknown.$APP_BUNDLE_NAME}
            VERSION=${VERSION:-1.0.0}
            
            if [ "$DEB_NAME" = "$NAME" ]; then
              DEB_NAME="$APP_BUNDLE_NAME"
            fi
            if [ "$DEB_DESC" = "$NAME application" ]; then
              DEB_DESC="$APP_BUNDLE_NAME application"
            fi
            
            # Build Deb
            LOWER_ID=$(echo "$BUNDLE_ID" | tr '[:upper:]' '[:lower:]' | tr -cd 'a-z0-9+._-')
            DEB_FILENAME="${LOWER_ID}_${VERSION}_iphoneos-arm.deb"
            BUILD_DIR="/tmp/deb_build_$NAME"
            rm -rf "$BUILD_DIR"
            mkdir -p "$BUILD_DIR/DEBIAN"
            mkdir -p "$BUILD_DIR/Applications"
            
            echo "Package: $LOWER_ID" > "$BUILD_DIR/DEBIAN/control"
            echo "Name: $DEB_NAME" >> "$BUILD_DIR/DEBIAN/control"
            echo "Version: $VERSION" >> "$BUILD_DIR/DEBIAN/control"
            echo "Architecture: iphoneos-arm" >> "$BUILD_DIR/DEBIAN/control"
            echo "Description: $DEB_DESC" >> "$BUILD_DIR/DEBIAN/control"
            echo "Maintainer: $DEB_MAINTAINER" >> "$BUILD_DIR/DEBIAN/control"
            echo "Author: $DEB_AUTHOR" >> "$BUILD_DIR/DEBIAN/control"
            echo "Section: $DEB_SECTION" >> "$BUILD_DIR/DEBIAN/control"
            if [ -n "$ICON_URL" ]; then
              echo "Icon: $ICON_URL" >> "$BUILD_DIR/DEBIAN/control"
            fi
            if [ -n "$DETAIL_PAGE" ]; then
              echo "Depiction: $DETAIL_PAGE" >> "$BUILD_DIR/DEBIAN/control"
            fi
            
            printf '#!/bin/sh\nsu -c uicache mobile\nexit 0\n' > "$BUILD_DIR/DEBIAN/postinst"
            printf '#!/bin/sh\nsu -c uicache mobile\nexit 0\n' > "$BUILD_DIR/DEBIAN/postrm"
            
            cp -R "$APP_PATH" "$BUILD_DIR/Applications/"
            
            find "$BUILD_DIR" -type d -exec chmod 0755 {} \;
            find "$BUILD_DIR" -type f -exec chmod 0644 {} \;
            chmod 0755 "$BUILD_DIR/DEBIAN/control"
            chmod 0755 "$BUILD_DIR/DEBIAN/postinst"
            chmod 0755 "$BUILD_DIR/DEBIAN/postrm"
            
            EXEC_NAME=$(read_plist "$INFO" CFBundleExecutable)
            EXEC_NAME=${EXEC_NAME:-$APP_BUNDLE_NAME}
            APP_EXEC="$BUILD_DIR/Applications/$(basename "$APP_PATH")/$EXEC_NAME"
            if [ -f "$APP_EXEC" ]; then
              chmod 0755 "$APP_EXEC"
            fi
            
            dpkg-deb -Zgzip --root-owner-group -b "$BUILD_DIR" "repo/debs/$DEB_FILENAME"
            echo "Built Deb: $DEB_FILENAME"
            
            # Build IPA
            IPA_BUILD_DIR="/tmp/ipa_build_$NAME"
            rm -rf "$IPA_BUILD_DIR"
            mkdir -p "$IPA_BUILD_DIR/Payload"
            
            cp -R "$APP_PATH" "$IPA_BUILD_DIR/Payload/"
            
            find "$IPA_BUILD_DIR/Payload" -type d -exec chmod 0755 {} \;
            find "$IPA_BUILD_DIR/Payload" -type f -exec chmod 0644 {} \;
            
            IPA_APP_EXEC="$IPA_BUILD_DIR/Payload/$(basename "$APP_PATH")/$EXEC_NAME"
            if [ -f "$IPA_APP_EXEC" ]; then
              chmod 0755 "$IPA_APP_EXEC"
            fi
            
            cd "$IPA_BUILD_DIR"
            zip -qr "${NAME}.ipa" Payload/
            
            cd "$GITHUB_WORKSPACE"
            mv -f "$IPA_BUILD_DIR/${NAME}.ipa" "assets/${NAME}.ipa"
            echo "Built IPA: assets/${NAME}.ipa"
            
            # Clear input folder contents but keep the folder and .gitkeep
            find "$APP_DIR_PATH" -mindepth 1 -maxdepth 1 ! -name ".gitkeep" -exec rm -rf {} +
            
            echo "Finished processing $NAME."
          done

      - name: Update Packages index
        run: |
          cd repo
          dpkg-scanpackages -m ./debs > Packages
          bzip2 -c Packages > Packages.bz2
          gzip -c9 Packages > Packages.gz
          xz -c9 Packages > Packages.xz

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add repo/debs/ repo/Packages repo/Packages.bz2 repo/Packages.gz repo/Packages.xz assets/*.ipa input/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Build debs and ipas, update repo, clean up inputs"
          git push