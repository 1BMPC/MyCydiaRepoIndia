<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MyPayIndia Repo</title>
<style>
* {
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  background-color: #efeff4;
  color: #000;
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

#splash {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 9999;
  overflow: hidden;
  -webkit-transition: opacity 0.5s ease;
  transition: opacity 0.5s ease;
}

#splash.fade-out {
  opacity: 0;
  pointer-events: none;
}

#splash-bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background-image: url('/assets/HuhnWaschen.png');
  background-position: center center;
  background-repeat: no-repeat;
  background-size: 100% 100%;
  -webkit-background-size: 100% 100%;
}

#splash-overlay {
  position: absolute;
  bottom: 60px;
  left: 0; right: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.ios-spinner {
  width: 36px;
  height: 36px;
  position: relative;
}

.ios-spinner-spoke {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
}

.ios-spinner-spoke::before {
  content: "";
  display: block;
  position: absolute;
  top: 1px;
  left: 50%;
  width: 3px;
  height: 9px;
  margin-left: -1.5px;
  border-radius: 2px;
  background: rgba(255,255,255,0.9);
}

@keyframes fade-spoke { 0% { opacity: 1; } 100% { opacity: 0.1; } }

.loading-label {
  font-size: 13px;
  color: #fff;
  margin-top: 10px;
  text-shadow: 0 1px 3px rgba(0,0,0,0.6);
}

#main {
  opacity: 0;
  transition: opacity 0.4s ease;
}

#main.visible { opacity: 1; }

.section {
  margin-top: 18px;
}

.section-header {
  font-size: 13px;
  font-weight: 400;
  color: #6d6d72;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding: 0 16px 4px;
}

.table-view {
  background: #fff;
  border-top: 1px solid #c8c7cc;
  border-bottom: 1px solid #c8c7cc;
}

.table-cell {
  display: flex;
  align-items: center;
  padding: 0 16px;
  height: 44px;
  background: #fff;
  position: relative;
  user-select: none;
  cursor: pointer;
}

.table-cell + .table-cell::before {
  content: "";
  position: absolute;
  top: 0;
  left: 57px;
  right: 0;
  height: 1px;
  background: #c8c7cc;
}

.table-cell:active { background-color: #d9d9d9; }

/* larger repo icon (as requested) */
.repo-icon-large {
  width: 58px;
  height: 58px;
  border-radius: 13px;
  margin-right: 12px;
  flex-shrink: 0;
  overflow: hidden;
}

.repo-icon-large img {
  width: 58px;
  height: 58px;
  display: block;
}

/* keep other icons unchanged */
.cell-icon {
  width: 29px;
  height: 29px;
  border-radius: 7px;
  margin-right: 12px;
  flex-shrink: 0;
  overflow: hidden;
}

.cell-icon img {
  width: 29px;
  height: 29px;
  display: block;
}

.cell-content {
  flex: 1;
  overflow: hidden;
}

.cell-title {
  font-size: 16px;
  color: #000;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cell-title-blue { color: #007aff; }

.cell-subtitle {
  font-size: 11px;
  color: #8e8e93;
}

.table-footer {
  font-size: 12px;
  color: #8e8e93;
  text-align: center;
  padding: 10px 24px 28px;
}
</style>
</head>
<body>

<div id="splash">
  <div id="splash-bg"></div>
  <div id="splash-overlay">
    <div class="ios-spinner">
      <div class="ios-spinner-spoke"></div><div class="ios-spinner-spoke"></div>
      <div class="ios-spinner-spoke"></div><div class="ios-spinner-spoke"></div>
      <div class="ios-spinner-spoke"></div><div class="ios-spinner-spoke"></div>
      <div class="ios-spinner-spoke"></div><div class="ios-spinner-spoke"></div>
      <div class="ios-spinner-spoke"></div><div class="ios-spinner-spoke"></div>
      <div class="ios-spinner-spoke"></div><div class="ios-spinner-spoke"></div>
    </div>
    <div class="loading-label">Loading&hellip;</div>
  </div>
</div>

<div id="main">

  <div class="section">
    <div class="section-header">Repository</div>
    <div class="table-view">
      <div class="table-cell">
        <div class="repo-icon-large">
          <img src="/repo/CydiaIcon.png" alt="Repo Icon">
        </div>
        <div class="cell-content">
          <div class="cell-title">MyPayIndia Repo</div>
          <div class="cell-subtitle">The official MyPayIndia Cydia Repo</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">Repository URL</div>
    <div class="table-view">
      <div class="table-cell">
        <div class="cell-content">
          <div class="cell-title">https://cydia.mypayindia.com/repo</div>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">Add to Package Manager</div>
    <div class="table-view">

      <div class="table-cell" onclick="addToCydia()">
        <div class="cell-icon"><img src="/assets/Cydia.png" alt="Cydia"></div>
        <div class="cell-content"><div class="cell-title cell-title-blue">Add to Cydia</div></div>
      </div>

      <div class="table-cell" onclick="addToSileo()">
        <div class="cell-icon"><img src="/assets/Sileo.png" alt="Sileo"></div>
        <div class="cell-content"><div class="cell-title cell-title-blue">Add to Sileo</div></div>
      </div>

      <div class="table-cell" onclick="addToZebra()">
        <div class="cell-icon"><img src="/assets/Zebra.png" alt="Zebra"></div>
        <div class="cell-content"><div class="cell-title cell-title-blue">Add to Zebra</div></div>
      </div>

    </div>
  </div>

  <div class="table-footer">&copy; MyPayIndia Repo &bull; All rights reserved</div>

</div>

<script>
var REPO = "https://cydia.mypayindia.com/repo";

function addToCydia() {
  window.location.href =
    "cydia://url/https://cydia.saurik.com/api/share#?source=" + encodeURIComponent(REPO);
}

function addToSileo() {
  window.location.href =
    "sileo://source/" + encodeURIComponent(REPO);
}

function addToZebra() {
  window.location.href =
    "zbra://sources/add/" + encodeURIComponent(REPO);
}

window.onload = function() {
  var splash = document.getElementById("splash");
  var main = document.getElementById("main");
  setTimeout(function() {
    splash.className = "fade-out";
    main.className = "visible";
    setTimeout(function() { splash.style.display = "none"; }, 500);
  }, 3000);
};
</script>

</body>
</html>
